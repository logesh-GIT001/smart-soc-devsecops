version: "3.9"

services:
  smart-soc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-soc-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - ENV=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "project=smart-soc"
      - "owner=logeshwaran"
